<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESign • Amaazbots</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,sans-serif;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050816;
    color:white;
}

.bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,198,255,.30),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(139,92,246,.25),transparent 30%),
        radial-gradient(circle at 50% 40%,rgba(34,211,238,.18),transparent 40%),
        #050816;
}

.bg::before{
    content:"";
    position:absolute;
    inset:-50%;
    background:
        radial-gradient(circle,rgba(255,255,255,.10) 1px,transparent 1px);
    background-size:40px 40px;
    animation:spin 90s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.card{
    position:relative;
    z-index:2;
    width:430px;
    max-width:92%;
    padding:42px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(30px);
    border-radius:30px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.icon{
    width:120px;
    height:120px;
    display:block;
    margin:0 auto 28px;
    object-fit:contain;
    padding:10px;
    border-radius:28px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 0 30px rgba(0,198,255,.25),
        0 15px 45px rgba(0,0,0,.45);
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

h1{
    font-size:36px;
    font-weight:800;
    margin-bottom:10px;
}

.subtitle{
    color:#cbd5e1;
    line-height:1.6;
    font-size:16px;
}

.info{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:18px;
}

.tag{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    padding:8px 16px;
    font-size:14px;
    color:#dbeafe;
}

.badge{
    display:inline-block;
    margin-top:22px;
    padding:10px 20px;
    border-radius:999px;
    background:rgba(24,201,100,.12);
    border:1px solid rgba(24,201,100,.35);
    color:#8df0b2;
    font-weight:700;
}

.install{
    margin-top:34px;
    width:100%;
    padding:20px;
    border:none;
    border-radius:18px;
    font-size:21px;
    font-weight:800;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#00c6ff,#6366f1);
    box-shadow:0 0 45px rgba(0,198,255,.45);
    transition:.25s;
}

.install:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 0 75px rgba(0,198,255,.75);
}

.install:active{
    transform:scale(.98);
}

.status{
    margin-top:22px;
    font-weight:600;
    color:#8ddfff;
}

.footer{
    margin-top:30px;
    font-size:13px;
    color:#718096;
}

.footer b{
    color:white;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="card">

<img src="esign-logo.png" class="icon" alt="ESign">

<h1>ESign</h1>

<p class="subtitle">
Install ESign directly to your iPhone or iPad using secure OTA installation.
</p>

<div class="info">

    <div class="tag">
        📱 iOS
    </div>

    <div class="tag">
        ⚡ OTA Install
    </div>

    <div class="tag">
        🔒 Secure
    </div>

</div>

<div class="badge">
    🟢 Ready to Install
</div>

<button class="install" onclick="install()">
    🚀 Install ESign
</button>

<div class="status" id="status">
    Preparing installer...
</div>

<div class="footer">
    Powered by <b>Amaazbots</b>
</div>

</div>

<script>

function install(){

    window.location.href =
    "itms-services://?action=download-manifest&url=https://website.khoindvn.io.vn/plists/kfccjimokhko.plist";

}

let seconds = 5;

const timer = setInterval(() => {

    seconds--;

    document.getElementById("status").innerHTML =
        seconds > 0
        ? `Launching installer in ${seconds} seconds...`
        : "Launching installer...";

    if(seconds <= 0){

        clearInterval(timer);
        install();

    }

},1000);

</script>

</body>
</html>
